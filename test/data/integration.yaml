pose_gt_file: "integration_poses.txt"
lidar_topic: "/test/rslidar_points"
radar_topic: "/test/radar_points"
verbose: false

extrinsics:
  R_bl: [1, 0, 0,
         0, 1, 0,
         0, 0, 1]
  t_bl: [0.0, 0.0, 0.0]
  R_lr: [1, 0, 0,
         0, 1, 0,
         0, 0, 1]
  t_lr: [0.0, 0.0, 0.0]

preprocess:
  pose_num_threshold: 7
  lidar_filter_num: 1
  lidar_blind: 0.1

mapper:
  type: 1
  publish_period: 0.0
  octomap:
    resolution: 0.5
    max_range: 20.0
    hit_prob: 0.7
    miss_prob: 0.4
    occupancy_threshold: 0.5
  ioctree:
    min_extent: 0.05
    bucket_size: 8
    downsample: false
    max_range: 20.0
